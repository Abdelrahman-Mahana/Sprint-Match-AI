# Development environment: PostgreSQL + SprintMatch API (+ optional pgAdmin via `--profile tools`).
# The LLM provider stays external and is configured through .env (LLM_PROVIDER, LLM_BASE_URL, ...).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprintmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sprintmatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sprintmatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sprintmatch}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sprintmatch}:${POSTGRES_PASSWORD}@db:5432/sprintmatch_test
    # An Ollama server on the host is reachable as LLM_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me-locally}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
